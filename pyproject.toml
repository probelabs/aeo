[project]
name = "aeo"
version = "0.1.0"
description = "Local-CLI AEO measurement: two-arm (knowledge vs search) evidence for Claude, Codex, and Grok"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ProbeLabs" }]
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.0"]

[project.scripts]
aeo = "aeo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeo = ["data/*.json"]
